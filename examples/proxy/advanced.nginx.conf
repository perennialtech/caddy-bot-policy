# Complete nginx.conf. Requires ngx_http_js_module and the two environment
# variables named below (both are also supplied to the Caddy filter).
load_module modules/ngx_http_js_module.so;
env BP_CLEARANCE_KEY;
env TURNSTILE_SITE_KEY;

events {}

http {
    js_import clearance from /etc/nginx/advanced-clearance.js;
    js_set $bp_cleared clearance.valid;

    server {
        listen 80;
        server_name example.com;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name example.com;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Named location keeps the original URI and POST body for Turnstile.
        error_page 418 = @challenge;

        location / {
            if ($bp_cleared = 0) { return 418; }
            proxy_pass http://application:3000;
        }

        location @challenge {
            proxy_pass http://filter:3000;
        }
    }
}
